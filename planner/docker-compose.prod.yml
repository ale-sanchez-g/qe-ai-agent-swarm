# Production Docker Compose configuration for MCP Planner Chat UI
version: '3.8'

services:
  planner-chat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: planner-chat-ui-prod
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LAUNCHDARKLY_SDK_KEY=${LAUNCHDARKLY_SDK_KEY}
      - DYNATRACE_ENDPOINT=${DYNATRACE_ENDPOINT:-}
      - DYNATRACE_API_TOKEN=${DYNATRACE_API_TOKEN:-}
    volumes:
      # Persistent data volumes
      - planner_output:/app/output
      - planner_logs:/app/logs
      - planner_memory:/app/memory
      - planner_memory_index:/app/memory_index
      
      # Configuration (read-only)
      - ./mcp_agent.config.yaml:/app/mcp_agent.config.yaml:ro
      - ./mcp_agent.secrets.yaml:/app/mcp_agent.secrets.yaml:ro
      - ./rag:/app/rag:ro
      
    restart: always
    
    # Enhanced health check for production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    # Production resource limits
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    
    # Security settings
    read_only: false
    tmpfs:
      - /tmp
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Redis for enhanced session management and caching
  redis:
    image: redis:7-alpine
    container_name: planner-redis-prod
    restart: always
    volumes:
      - redis_data:/data
    command: >
      redis-server 
      --appendonly yes 
      --maxmemory 256mb 
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: planner-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - planner-chat
    restart: always
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

# Named volumes for data persistence
volumes:
  planner_output:
    driver: local
  planner_logs:
    driver: local
  planner_memory:
    driver: local
  planner_memory_index:
    driver: local
  redis_data:
    driver: local

# Custom network for isolation
networks:
  default:
    name: planner-prod-network
    driver: bridge
