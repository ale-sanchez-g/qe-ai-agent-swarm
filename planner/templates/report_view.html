<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Viewer - MCP Planner</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Add marked.js for markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Add highlight.js for code syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script type="text/javascript"
        src="https://js-cdn.dynatrace.com/jstag/161f5a57e21/bf46143ler/456a65871fc4659b_complete.js"
        crossorigin="anonymous">
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 0;
        }

        .report-container {
            width: 90%;
            max-width: 1200px;
            min-height: 90vh;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }
        
        .report-header {
            padding: 20px;
            background-color: #2c3e50;
            color: white;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .report-title {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        
        .report-meta {
            font-size: 14px;
            color: #bdc3c7;
        }
        
        .report-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .action-button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            text-decoration: none;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        
        .action-button:hover {
            background-color: #2980b9;
        }
        
        .action-button.secondary {
            background-color: #95a5a6;
        }
        
        .action-button.secondary:hover {
            background-color: #7f8c8d;
        }
        
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .report-content {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
            line-height: 1.6;
        }
        
        .error-message {
            text-align: center;
            padding: 40px 20px;
            color: #e74c3c;
            font-size: 18px;
        }
        
        /* Markdown content styling */
        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3,
        .markdown-content h4,
        .markdown-content h5,
        .markdown-content h6 {
            color: #2c3e50;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        
        .markdown-content h1 {
            font-size: 28px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        
        .markdown-content h2 {
            font-size: 24px;
            border-bottom: 1px solid #bdc3c7;
            padding-bottom: 8px;
        }
        
        .markdown-content h3 {
            font-size: 20px;
        }
        
        .markdown-content p {
            margin-bottom: 15px;
            text-align: justify;
        }
        
        .markdown-content ul,
        .markdown-content ol {
            margin-bottom: 15px;
            padding-left: 30px;
        }
        
        .markdown-content li {
            margin-bottom: 8px;
        }
        
        .markdown-content blockquote {
            border-left: 4px solid #3498db;
            margin: 15px 0;
            padding: 10px 20px;
            background-color: #f8f9fa;
            font-style: italic;
        }
        
        .markdown-content code {
            background-color: #f1f2f6;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
        }
        
        .markdown-content pre {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 15px;
            overflow-x: auto;
            margin: 15px 0;
        }
        
        .markdown-content pre code {
            background: none;
            padding: 0;
        }
        
        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        
        .markdown-content th,
        .markdown-content td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        
        .markdown-content th {
            background-color: #f8f9fa;
            font-weight: 600;
        }
        
        .markdown-content tr:nth-child(even) {
            background-color: #f8f9fa;
        }
        
        .markdown-content a {
            color: #3498db;
            text-decoration: none;
        }
        
        .markdown-content a:hover {
            text-decoration: underline;
        }
        
        .navigation {
            padding: 20px;
            border-top: 1px solid #e9e9e9;
            background-color: #f8f9fa;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            text-align: center;
        }
        
        .navigation a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 0 10px;
            transition: background-color 0.3s;
        }
        
        .navigation a:hover {
            background-color: #1a252f;
        }
        
        /* Responsive design */
        @media (max-width: 768px) {
            .report-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .report-actions {
                width: 100%;
                justify-content: flex-start;
            }
            
            .report-content {
                padding: 20px;
            }
            
            .markdown-content h1 {
                font-size: 24px;
            }
            
            .markdown-content h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="report-container">
        <div class="report-header">
            <div>
                <h1 class="report-title" id="report-title">Loading Report...</h1>
                <div class="report-meta" id="report-meta"></div>
            </div>
            <div class="report-actions">
                <button class="action-button" id="download-btn" onclick="downloadReport()" style="display: none;">
                    📥 Download
                </button>
                <button class="action-button secondary" onclick="copyToClipboard()">
                    📋 Copy
                </button>
                <button class="action-button secondary" onclick="printReport()">
                    🖨️ Print
                </button>
            </div>
        </div>
        
        <div class="report-content">
            <div class="loading-container" id="loading">
                <div class="spinner"></div>
                <span style="margin-left: 15px;">Loading report content...</span>
            </div>
            <div id="report-content" style="display: none;"></div>
            <div id="error-content" style="display: none;" class="error-message"></div>
        </div>
        
        <div class="navigation">
            <a href="/reports">📋 Back to Reports</a>
            <a href="/">💬 Back to Chat</a>
        </div>
    </div>

    <script>
        let currentReportData = null;
        
        // Get filename from URL parameters
        function getFilenameFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('file');
        }
        
        // Format file size
        function formatFileSize(bytes) {
            if (bytes < 1024) {
                return bytes + ' B';
            } else if (bytes < 1024 * 1024) {
                return (bytes / 1024).toFixed(2) + ' KB';
            } else {
                return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
            }
        }
        
        // Format date
        function formatDate(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleString();
        }
        
        // Load and display report
        async function loadReport() {
            const filename = getFilenameFromURL();
            
            if (!filename) {
                showError('No report file specified in URL');
                return;
            }
            
            try {
                const response = await fetch(`/report/${filename}`);
                const data = await response.json();
                
                if (data.error) {
                    showError(data.error);
                    return;
                }
                
                currentReportData = data;
                displayReport(data);
                
            } catch (error) {
                console.error('Error loading report:', error);
                showError('Failed to load report. Please try again later.');
            }
        }
        
        // Display report content
        function displayReport(reportData) {
            // Update header
            document.getElementById('report-title').textContent = reportData.filename;
            document.getElementById('report-meta').innerHTML = `
                Created: ${formatDate(reportData.created)} | 
                Size: ${formatFileSize(reportData.size)}
            `;
            
            // Show download button
            document.getElementById('download-btn').style.display = 'inline-block';
            
            // Parse and display markdown content
            const markdownContent = marked.parse(reportData.content);
            document.getElementById('report-content').innerHTML = 
                `<div class="markdown-content">${markdownContent}</div>`;
            
            // Highlight code blocks
            document.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });
            
            // Hide loading, show content
            document.getElementById('loading').style.display = 'none';
            document.getElementById('report-content').style.display = 'block';
        }
        
        // Show error message
        function showError(message) {
            document.getElementById('error-content').textContent = message;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-content').style.display = 'block';
        }
        
        // Download report
        function downloadReport() {
            if (currentReportData) {
                window.location.href = `/download/${currentReportData.filename}`;
            }
        }
        
        // Copy content to clipboard
        async function copyToClipboard() {
            if (currentReportData) {
                try {
                    await navigator.clipboard.writeText(currentReportData.content);
                    
                    // Show temporary feedback
                    const button = event.target;
                    const originalText = button.textContent;
                    button.textContent = '✓ Copied!';
                    button.style.backgroundColor = '#27ae60';
                    
                    setTimeout(() => {
                        button.textContent = originalText;
                        button.style.backgroundColor = '#95a5a6';
                    }, 2000);
                    
                } catch (error) {
                    console.error('Failed to copy to clipboard:', error);
                    alert('Failed to copy content to clipboard');
                }
            }
        }
        
        // Print report
        function printReport() {
            window.print();
        }
        
        // Load report when page loads
        document.addEventListener('DOMContentLoaded', loadReport);
        
        // Handle browser back/forward navigation
        window.addEventListener('popstate', loadReport);
    </script>
</body>
</html>
