<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Planner Reports</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* Additional styles specific to the reports page */
        .reports-container {
            width: 90%;
            max-width: 1000px;
            min-height: 90vh;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }
        
        .reports-header {
            padding: 15px;
            background-color: #2c3e50;
            color: white;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .reports-list {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
        }
        
        .report-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 8px;
            background-color: #f9f9f9;
            border-radius: 5px;
            border-left: 4px solid #3498db;
        }
        
        .report-details {
            flex-grow: 1;
        }
        
        .report-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .report-meta {
            font-size: 12px;
            color: #777;
        }
        
        .download-button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        .download-button:hover {
            background-color: #2980b9;
        }
        
        .no-reports {
            text-align: center;
            padding: 40px 0;
            color: #777;
            font-style: italic;
        }
        
        .navigation {
            padding: 15px;
            border-top: 1px solid #e9e9e9;
            text-align: center;
        }
        
        .navigation a {
            display: inline-block;
            padding: 8px 15px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin: 0 10px;
        }
        
        .navigation a:hover {
            background-color: #1a252f;
        }
    </style>
</head>
<body>
    <div class="reports-container">
        <div class="reports-header">
            <img src="/static/images/devops1-logo-reversed.svg" alt="DO1-logo" style="height: 40%;">
            <h1>MCP Planner Reports</h1>
        </div>
        <div class="navigation">
            <a href="/">Back to Chat</a>
        </div>
        <div class="reports-list" id="reports-list">
            <!-- Reports will be loaded here dynamically -->
        </div>
        
    </div>

    <script>
        // Function to format file size
        function formatFileSize(bytes) {
            if (bytes < 1024) {
                return bytes + ' B';
            } else if (bytes < 1024 * 1024) {
                return (bytes / 1024).toFixed(2) + ' KB';
            } else {
                return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
            }
        }

        // Function to format date
        function formatDate(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleString();
        }

        // Function to load reports
        async function loadReports() {
            try {
                const response = await fetch('/list_reports');
                const data = await response.json();
                const reportsList = document.getElementById('reports-list');
                
                if (data.reports && data.reports.length > 0) {
                    let reportsHTML = '';
                    
                    data.reports.forEach(report => {
                        reportsHTML += `
                            <div class="report-item">
                                <div class="report-details">
                                    <div class="report-title">${report.filename}</div>
                                    <div class="report-meta">
                                        Created: ${formatDate(report.created)} | Size: ${formatFileSize(report.size)}
                                    </div>
                                </div>
                                <a href="/view?file=${report.filename}" class="download-button" style="margin-left: 10px; background-color: #27ae60;">View Report</a>
                            </div>
                        `;
                    });
                    
                    reportsList.innerHTML = reportsHTML;
                } else {
                    reportsList.innerHTML = '<div class="no-reports">No reports available</div>';
                }
            } catch (error) {
                console.error('Error loading reports:', error);
                document.getElementById('reports-list').innerHTML = 
                    '<div class="no-reports">Error loading reports. Please try again later.</div>';
            }
        }

        // Load reports when the page loads
        document.addEventListener('DOMContentLoaded', loadReports);
    </script>
</body>
</html>
