<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Planner Chat</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <style>
        .view-reports-link {
            margin-left: 15px;
            color: #fff;
            text-decoration: none;
            background-color: #2980b9;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 14px;
        }
        .view-reports-link:hover {
            background-color: #3498db;
        }
        
        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.5);
        }
        
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            border-radius: 5px;
            width: 80%;
            max-width: 500px;
        }
        
        .modal-header {
            padding-bottom: 10px;
            margin-bottom: 15px;
            border-bottom: 1px solid #e9e9e9;
        }
        
        .modal-header h2 {
            font-size: 18px;
            margin: 0;
            color: #2c3e50;
        }
        
        .modal-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        
        .modal-button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .modal-submit {
            background-color: #2c3e50;
            color: white;
        }
        
        .modal-cancel {
            background-color: #95a5a6;
            color: white;
        }
        
        .modal-submit:hover {
            background-color: #1a2530;
        }
        
        .modal-cancel:hover {
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>
    <!-- Custom Modal -->
    <div id="customModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Enter Information</h2>
            </div>
            <input type="text" id="modal-input" class="modal-input" placeholder="Enter information">
            <div class="modal-buttons">
                <button id="modal-cancel" class="modal-button modal-cancel">Cancel</button>
                <button id="modal-submit" class="modal-button modal-submit">Submit</button>
            </div>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <h1>MCP Planner Chat</h1>
            <div style="display: flex; align-items: center;">
                <div class="connection-status">
                    <span id="status-indicator" class="status-disconnected"></span>
                    <span id="status-text">Disconnected</span>
                </div>
                <a href="/reports" class="view-reports-link">View Reports</a>
            </div>
        </div>
        
        <div class="quick-actions">
            <button id="confluence-button" class="quick-action-button">Find information from a Confluence page</button>
        </div>
        
        <div class="chat-messages" id="chat-messages"></div>
        
        <div class="chat-input-container">
            <textarea id="message-input" placeholder="Type your message here..." rows="3"></textarea>
            <button id="send-button" disabled>Send</button>
        </div>
    </div>

    <script src="/static/js/chat.js"></script>
</body>
</html>
