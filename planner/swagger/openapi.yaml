openapi: 3.0.3
info:
  title: Planner Chat UI API
  description: |
    Interactive Chat UI for LLM and MCP Integration
    
    This API provides a FastAPI-based web interface for interacting with MCP agents.
    It includes conversation memory management, WebSocket communication, and file management capabilities.
    
    ## Features
    - Interactive web chat interface with WebSocket communication
    - Conversation memory management with SQLite backend
    - Multi-MCP server integration (Atlassian, filesystem, fetch)
    - LaunchDarkly AI integration for dynamic configuration
    - Session management for multiple concurrent users
    - File management for downloading and viewing reports
    - Real-time status updates and system messages
    - OpenTelemetry integration for observability
    
    ## WebSocket Communication
    The chat interface uses WebSocket connections at `/ws` for real-time communication.
    Each connection receives a unique session ID for conversation context.
  version: "1.0.0"
  contact:
    name: QE AI Agent Swarm Team
    email: alejandro.sanchez-giraldo@devops1.com.au
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://planner-chat.example.com
    description: Production server

tags:
  - name: Chat Interface
    description: Main chat interface and health endpoints
  - name: File Management
    description: File download and report management endpoints
  - name: Memory Management
    description: Session and conversation memory management
  - name: WebSocket
    description: Real-time WebSocket communication

paths:
  /:
    get:
      tags:
        - Chat Interface
      summary: Get main chat interface
      description: Serves the main HTML chat interface for user interaction
      operationId: getChatPage
      responses:
        '200':
          description: HTML chat interface
          content:
            text/html:
              schema:
                type: string
                example: "<!DOCTYPE html><html>...</html>"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health:
    get:
      tags:
        - Chat Interface
      summary: Health check endpoint
      description: Returns the service health status for monitoring and load balancing
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                required:
                  - status
        '500':
          description: Service is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /reports:
    get:
      tags:
        - File Management
      summary: Get reports viewing interface
      description: Serves the HTML interface for viewing and managing generated reports
      operationId: getReportsPage
      responses:
        '200':
          description: HTML reports interface
          content:
            text/html:
              schema:
                type: string
                example: "<!DOCTYPE html><html>...</html>"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /download/{filename}:
    get:
      tags:
        - File Management
      summary: Download a specific file
      description: Downloads a file from the output directory (typically conversation reports in Markdown format)
      operationId: downloadFile
      parameters:
        - name: filename
          in: path
          required: true
          description: Name of the file to download
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_\-\.]+\.(md|txt|json)$'
            example: "5adac717-9cfc-4986-a589-9084b11bee46_4b56adf7-664f-4870-96b1-b35626abf4d3.md"
      responses:
        '200':
          description: File download successful
          content:
            text/markdown:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: Attachment header for file download
              schema:
                type: string
                example: "attachment; filename=report.md"
        '404':
          description: File not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "File not found"
        '400':
          description: Invalid filename
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /list_reports:
    get:
      tags:
        - File Management
      summary: List all available reports
      description: Returns a list of all report files in the output directory with metadata
      operationId: listReports
      responses:
        '200':
          description: List of available reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReportFile'
                required:
                  - reports
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /memory/sessions:
    get:
      tags:
        - Memory Management
      summary: List active conversation sessions
      description: Returns all active session IDs and their count for memory management
      operationId: listSessions
      responses:
        '200':
          description: List of active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: string
                      format: uuid
                    example: ["5adac717-9cfc-4986-a589-9084b11bee46", "c0e82852-4187-4007-afb7-18f05e57e276"]
                  count:
                    type: integer
                    minimum: 0
                    example: 2
                required:
                  - sessions
                  - count
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /memory/session/{session_id}:
    delete:
      tags:
        - Memory Management
      summary: Clear session memory
      description: Clears all conversation memory for a specific session ID
      operationId: clearSession
      parameters:
        - name: session_id
          in: path
          required: true
          description: UUID of the session to clear
          schema:
            type: string
            format: uuid
            example: "5adac717-9cfc-4986-a589-9084b11bee46"
      responses:
        '200':
          description: Session memory cleared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Session 5adac717-9cfc-4986-a589-9084b11bee46 memory cleared"
                required:
                  - message
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Session not found"
        '400':
          description: Invalid session ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /memory/session/{session_id}/history:
    get:
      tags:
        - Memory Management
      summary: Get session conversation history
      description: Retrieves the conversation history for a specific session (last 50 messages)
      operationId: getSessionHistory
      parameters:
        - name: session_id
          in: path
          required: true
          description: UUID of the session to retrieve history for
          schema:
            type: string
            format: uuid
            example: "5adac717-9cfc-4986-a589-9084b11bee46"
      responses:
        '200':
          description: Session conversation history
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
                    example: "5adac717-9cfc-4986-a589-9084b11bee46"
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConversationMessage'
                    maxItems: 50
                required:
                  - session_id
                  - messages
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Session not found"
        '400':
          description: Invalid session ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /ws:
    get:
      tags:
        - WebSocket
      summary: WebSocket endpoint for real-time chat
      description: |
        WebSocket endpoint for real-time chat communication. 
        
        **Connection Flow:**
        1. Client connects to WebSocket endpoint
        2. Server assigns unique session ID
        3. Client sends JSON messages with action and content
        4. Server processes messages through MCP agents and LLM
        5. Server sends back responses in real-time
        
        **Message Format:**
        - **Client to Server:** `{"action": "message", "content": "user message"}`
        - **Server to Client:** `{"type": "user|bot|system", "content": "message content"}`
        
        **Message Types:**
        - `user`: Echo of user's message
        - `bot`: AI-generated response
        - `system`: Status updates (connecting, processing, errors)
      operationId: websocketEndpoint
      responses:
        '101':
          description: WebSocket connection established
        '400':
          description: Bad request - invalid WebSocket upgrade
        '500':
          description: Internal server error during WebSocket handling

components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        detail:
          type: string
          description: Detailed error information
      required:
        - error
      example:
        error: "Internal server error"
        detail: "Failed to process request"

    ReportFile:
      type: object
      properties:
        filename:
          type: string
          description: Name of the report file
          example: "5adac717-9cfc-4986-a589-9084b11bee46_4b56adf7-664f-4870-96b1-b35626abf4d3.md"
        created:
          type: number
          format: float
          description: Unix timestamp of file creation
          example: 1691827200.0
        size:
          type: integer
          minimum: 0
          description: File size in bytes
          example: 2048
      required:
        - filename
        - created
        - size

    ConversationMessage:
      type: object
      properties:
        type:
          type: string
          enum: [user, ai]
          description: Type of message (user input or AI response)
          example: "user"
        content:
          type: string
          description: Message content
          example: "What are the current project issues?"
      required:
        - type
        - content

    WebSocketMessage:
      oneOf:
        - $ref: '#/components/schemas/ClientMessage'
        - $ref: '#/components/schemas/ServerMessage'

    ClientMessage:
      type: object
      description: Message sent from client to server via WebSocket
      properties:
        action:
          type: string
          enum: [message]
          description: Action type for the message
          example: "message"
        content:
          type: string
          description: User message content
          example: "Analyze the latest project data"
      required:
        - action
        - content

    ServerMessage:
      type: object
      description: Message sent from server to client via WebSocket
      properties:
        type:
          type: string
          enum: [user, bot, system]
          description: Type of server message
          example: "bot"
        content:
          type: string
          description: Message content
          example: "Based on the latest data analysis..."
      required:
        - type
        - content

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for authentication (if implemented)

# Note: Currently no authentication is implemented in the FastAPI application
# security:
#   - ApiKeyAuth: []

externalDocs:
  description: Project Repository
  url: https://github.com/ale-sanchez-g/qe-ai-agent-swarm
