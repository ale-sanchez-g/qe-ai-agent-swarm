version: '3.8'

services:
  chat-app:
    build: .
    ports:
      - "5001:5001"
    environment:
      - LAUNCHDARKLY_SDK_KEY=${LAUNCHDARKLY_SDK_KEY}
      - LAUNCHDARKLY_AI_CONFIG_KEY=${LAUNCHDARKLY_AI_CONFIG_KEY:-chat-ai-config}
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-your-secret-key-change-this}
      - FLASK_ENV=${FLASK_ENV:-production}
    volumes:
      - ~/.aws:/home/app/.aws:ro  # Mount AWS credentials
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat-app
    restart: unless-stopped
    profiles:
      - production