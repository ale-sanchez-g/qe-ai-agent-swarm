<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI FinBot - Login</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        
        .login-header {
            margin-bottom: 2rem;
        }
        
        .login-icon {
            font-size: 4rem;
            color: #667eea;
            margin-bottom: 1rem;
        }
        
        .login-title {
            color: #2c3e50;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .login-subtitle {
            color: #6c757d;
            font-size: 1rem;
        }
        
        .form-floating {
            margin-bottom: 1.5rem;
        }
        
        .form-control {
            border-radius: 15px;
            border: 2px solid #e9ecef;
            padding: 1rem 1.25rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 15px;
            padding: 1rem 2rem;
            font-weight: 600;
            font-size: 1.1rem;
            width: 100%;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-login:disabled {
            opacity: 0.7;
            transform: none;
            box-shadow: none;
        }
        
        .browser-info {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: #6c757d;
        }
        
        .browser-info-title {
            font-weight: 600;
            color: #495057;
            margin-bottom: 0.5rem;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: none;
        }
        
        .loading-spinner {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="bi bi-robot login-icon"></i>
                <h1 class="login-title">AI FinBot</h1>
                <p class="login-subtitle">Enter your User ID to start chatting</p>
            </div>
            
            <form id="login-form">
                <div id="error-message" class="error-message"></div>
                
                <div class="form-floating">
                    <input type="text" class="form-control" id="user-id" placeholder="Enter your User ID" 
                           required maxlength="50" pattern="[a-zA-Z0-9_\-]+" 
                           title="Only letters, numbers, dashes, and underscores allowed">
                    <label for="user-id"><i class="bi bi-person me-2"></i>User ID</label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-login" id="login-button">
                    <span class="login-text">
                        <i class="bi bi-chat-dots me-2"></i>Start Chatting
                    </span>
                    <span class="loading-spinner">
                        <div class="spinner-border spinner-border-sm me-2" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        Connecting...
                    </span>
                </button>
                
                <div class="browser-info">
                    <div class="browser-info-title">
                        <i class="bi bi-info-circle me-1"></i>Browser Information Collected
                    </div>
                    <div id="browser-details">
                        Collecting browser details for personalized experience...
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast for notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="notification-toast" class="toast" role="alert">
            <div class="toast-header">
                <i class="bi bi-info-circle me-2"></i>
                <strong class="me-auto">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toast-message">
                <!-- Toast message content -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        class LoginApp {
            constructor() {
                this.form = document.getElementById('login-form');
                this.userIdInput = document.getElementById('user-id');
                this.loginButton = document.getElementById('login-button');
                this.errorMessage = document.getElementById('error-message');
                this.browserDetails = document.getElementById('browser-details');
                
                this.init();
            }

            init() {
                // Collect browser details immediately
                this.collectBrowserDetails();
                
                // Event listeners
                this.form.addEventListener('submit', (e) => this.handleLogin(e));
                this.userIdInput.addEventListener('input', () => this.clearError());
                
                // Focus on input
                this.userIdInput.focus();
            }

            collectBrowserDetails() {
                const details = {
                    userAgent: navigator.userAgent,
                    platform: navigator.platform,
                    language: navigator.language || navigator.userLanguage,
                    cookieEnabled: navigator.cookieEnabled,
                    onLine: navigator.onLine,
                    screenResolution: `${screen.width}x${screen.height}`,
                    viewport: `${window.innerWidth}x${window.innerHeight}`,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    colorDepth: screen.colorDepth,
                    pixelDepth: screen.pixelDepth
                };

                // Detect browser name and version
                const ua = navigator.userAgent;
                let browserName = 'Unknown';
                let browserVersion = 'Unknown';

                if (ua.indexOf('Chrome') > -1 && ua.indexOf('Edge') === -1) {
                    browserName = 'Chrome';
                    browserVersion = ua.match(/Chrome\/([0-9.]+)/)?.[1] || 'Unknown';
                } else if (ua.indexOf('Firefox') > -1) {
                    browserName = 'Firefox';
                    browserVersion = ua.match(/Firefox\/([0-9.]+)/)?.[1] || 'Unknown';
                } else if (ua.indexOf('Safari') > -1 && ua.indexOf('Chrome') === -1) {
                    browserName = 'Safari';
                    browserVersion = ua.match(/Version\/([0-9.]+)/)?.[1] || 'Unknown';
                } else if (ua.indexOf('Edge') > -1) {
                    browserName = 'Edge';
                    browserVersion = ua.match(/Edge\/([0-9.]+)/)?.[1] || 'Unknown';
                }

                details.browserName = browserName;
                details.browserVersion = browserVersion;

                // Detect device type
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua);
                const isTablet = /iPad|Android(?!.*Mobile)/i.test(ua);
                
                if (isMobile && !isTablet) {
                    details.deviceType = 'Mobile';
                } else if (isTablet) {
                    details.deviceType = 'Tablet';
                } else {
                    details.deviceType = 'Desktop';
                }

                this.browserInfo = details;
                this.displayBrowserInfo();
            }

            displayBrowserInfo() {
                const info = this.browserInfo;
                this.browserDetails.innerHTML = `
                    <div class="text-start">
                        <small>
                            <strong>${info.browserName}</strong> ${info.browserVersion} on ${info.platform}<br>
                            <strong>Device:</strong> ${info.deviceType} (${info.screenResolution})<br>
                            <strong>Language:</strong> ${info.language} | <strong>Timezone:</strong> ${info.timezone}
                        </small>
                    </div>
                `;
            }

            async handleLogin(e) {
                e.preventDefault();
                
                const userId = this.userIdInput.value.trim();
                
                if (!userId) {
                    this.showError('User ID is required');
                    return;
                }

                if (userId.length < 2 || userId.length > 50) {
                    this.showError('User ID must be between 2 and 50 characters');
                    return;
                }

                if (!/^[a-zA-Z0-9_-]+$/.test(userId)) {
                    this.showError('User ID can only contain letters, numbers, dashes, and underscores');
                    return;
                }

                this.setLoading(true);
                this.clearError();

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            userId: userId,
                            browserDetails: this.browserInfo
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        this.showToast('Login successful! Redirecting to chat...', 'success');
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1000);
                    } else {
                        this.showError(data.error || 'Login failed. Please try again.');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    this.showError('Network error. Please check your connection and try again.');
                } finally {
                    this.setLoading(false);
                }
            }

            setLoading(loading) {
                const loginText = this.loginButton.querySelector('.login-text');
                const loadingSpinner = this.loginButton.querySelector('.loading-spinner');
                
                if (loading) {
                    loginText.style.display = 'none';
                    loadingSpinner.style.display = 'inline-block';
                    this.loginButton.disabled = true;
                    this.userIdInput.disabled = true;
                } else {
                    loginText.style.display = 'inline-block';
                    loadingSpinner.style.display = 'none';
                    this.loginButton.disabled = false;
                    this.userIdInput.disabled = false;
                }
            }

            showError(message) {
                this.errorMessage.textContent = message;
                this.errorMessage.style.display = 'block';
                this.userIdInput.focus();
            }

            clearError() {
                this.errorMessage.style.display = 'none';
            }

            showToast(message, type = 'info') {
                const toast = document.getElementById('notification-toast');
                const toastMessage = document.getElementById('toast-message');
                const toastHeader = toast.querySelector('.toast-header strong');
                const toastIcon = toast.querySelector('.bi');

                toastMessage.textContent = message;

                switch (type) {
                    case 'success':
                        toastHeader.textContent = 'Success';
                        toastIcon.className = 'bi bi-check-circle-fill me-2 text-success';
                        toast.className = 'toast border-success';
                        break;
                    case 'error':
                        toastHeader.textContent = 'Error';
                        toastIcon.className = 'bi bi-exclamation-triangle-fill me-2 text-danger';
                        toast.className = 'toast border-danger';
                        break;
                    default:
                        toastHeader.textContent = 'Information';
                        toastIcon.className = 'bi bi-info-circle-fill me-2 text-info';
                        toast.className = 'toast border-info';
                }

                const bsToast = new bootstrap.Toast(toast, { delay: 3000 });
                bsToast.show();
            }
        }

        // Initialize login app when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new LoginApp();
        });
    </script>
</body>
</html>
