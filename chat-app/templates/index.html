<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container-fluid h-100">
        <div class="row h-100">
            <!-- Main Chat Area -->
            <div class="col-12">
                <!-- Header -->
                <div class="chat-header">
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center">
                            <i class="bi bi-robot me-2 text-primary" style="font-size: 1.5rem;"></i>
                            <h4 class="mb-0">AI Chat Assistant</h4>
                        </div>
                        <div class="d-flex align-items-center">
                            <span id="status-indicator" class="status-dot me-2"></span>
                            <button id="clear-chat" class="btn btn-outline-secondary btn-sm me-2">
                                <i class="bi bi-trash"></i> Clear
                            </button>
                            <div class="dropdown">
                                <button class="btn btn-outline-primary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                    <i class="bi bi-gear"></i>
                                </button>
                                <ul class="dropdown-menu">
                                    <li><span class="dropdown-item-text small">Powered by LaunchDarkly</span></li>
                                    <li><span class="dropdown-item-text small">AWS Bedrock Integration</span></li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li><button class="dropdown-item" id="health-check">Check Status</button></li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Chat Messages -->
                <div class="chat-container">
                    <div id="chat-messages" class="chat-messages">
                        <!-- Welcome message -->
                        <div class="message assistant-message">
                            <div class="message-avatar">
                                <i class="bi bi-robot"></i>
                            </div>
                            <div class="message-content">
                                <div class="message-bubble">
                                    <p>Hello! I'm your AI assistant. How can I help you today?</p>
                                    <small class="message-time">Welcome</small>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Typing Indicator -->
                    <div id="typing-indicator" class="message assistant-message" style="display: none;">
                        <div class="message-avatar">
                            <i class="bi bi-robot"></i>
                        </div>
                        <div class="message-content">
                            <div class="message-bubble">
                                <div class="typing-dots">
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="chat-input-container">
                    <div class="input-group">
                        <input type="text" id="message-input" class="form-control" 
                               placeholder="Type your message here..." 
                               maxlength="1000">
                        <button class="btn btn-primary" type="button" id="send-button">
                            <i class="bi bi-send"></i>
                        </button>
                    </div>
                    <div class="input-help-text">
                        <small class="text-muted">Press Enter to send • Powered by LaunchDarkly + AWS Bedrock</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast for notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="notification-toast" class="toast" role="alert">
            <div class="toast-header">
                <i class="bi bi-info-circle me-2"></i>
                <strong class="me-auto">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toast-message">
                <!-- Toast message content -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
